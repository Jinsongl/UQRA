name: Adaptive compatibility

on:
  pull_request:
  push:
    branches: [master]

jobs:
  windows-python312:
    name: Windows Python 3.12 acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/compatibility-py312.txt
            requirements/security-audit-py312.txt
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/compatibility-py312.txt
          python -m pip install -r requirements/security-audit-py312.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Complete compatibility, schema, and warning suite
        run: python -m pytest tests/packaging tests/compatibility -q
      - name: Audit dependencies and bind the lock Git blob
        shell: pwsh
        run: >-
          ./tools/security/run_security_audit.ps1
          -Python (Get-Command python).Source
          -Repository "${{ github.workspace }}"
          -Revision "${{ github.sha }}"
          -EvidenceDir "${{ runner.temp }}/uqra-security-evidence"
      - name: Verify byte-reproducible wheel and sdist
        shell: pwsh
        run: |
          $epoch = git show -s --format=%ct "${{ github.sha }}"
          ./tools/packaging/run_reproducible_build.ps1 `
            -Python (Get-Command python).Source `
            -SourceDir "${{ github.workspace }}" `
            -OutputRoot "${{ runner.temp }}/uqra-reproducible-build" `
            -SourceDateEpoch $epoch `
            -SourceCommit "${{ github.sha }}" `
            -EvidencePath "${{ runner.temp }}/uqra-build-evidence/reproducible-build.json"
      - name: Build and clean-install wheel and sdist
        shell: pwsh
        run: >-
          ./tools/packaging/run_clean_install.ps1
          -Python (Get-Command python).Source
          -ArtifactDir "${{ runner.temp }}/uqra-dist"
          -WorkDir "${{ runner.temp }}/uqra-clean-install"
          -EvidenceDir "${{ runner.temp }}/uqra-packaging-evidence"
          -SourceCommit "${{ github.sha }}"
      - name: Exercise Windows special paths
        shell: pwsh
        run: |
          $epoch = git show -s --format=%ct "${{ github.sha }}"
          ./tools/packaging/run_windows_path_regression.ps1 `
            -Python (Get-Command python).Source `
            -SourceDir "${{ github.workspace }}" `
            -ScratchRoot "${{ runner.temp }}/uqra-special-paths" `
            -SourceDateEpoch $epoch `
            -EvidencePath "${{ runner.temp }}/uqra-path-evidence/windows-path-regression.json"
      - name: Upload M5 acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: uqra-windows-python312-m5-evidence
          path: |
            ${{ runner.temp }}/uqra-security-evidence/**
            ${{ runner.temp }}/uqra-reproducible-build/first/*
            ${{ runner.temp }}/uqra-build-evidence/**
            ${{ runner.temp }}/uqra-dist/*
            ${{ runner.temp }}/uqra-packaging-evidence/**
            ${{ runner.temp }}/uqra-path-evidence/**
          if-no-files-found: error

  adaptive-compatibility-gate:
    name: Adaptive compatibility gate
    if: ${{ always() }}
    needs: windows-python312
    # This job only aggregates the Windows result; it is not Ubuntu compatibility validation.
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Windows Python 3.12 result
        run: test "${{ needs.windows-python312.result }}" = success
